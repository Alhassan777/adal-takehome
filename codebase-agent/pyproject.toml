[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-agent"
version = "0.1.0"
description = "Dockerized Python codebase navigation agent with structured tools for LLM-driven code understanding"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "networkx>=3.0",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.24",
    "msgpack>=1.0",
    "watchfiles>=0.21",
    "prompt_toolkit>=3.0",
    "openai>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
codebase-agent = "codebase_agent.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
